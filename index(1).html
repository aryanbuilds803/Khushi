<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anushka - Date?</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
  font-family:Arial,sans-serif; overflow:hidden;
  background:linear-gradient(135deg,#ffd6e7,#d9e7ff);
}
.card{
  width:min(92vw,430px); min-height:560px; padding:34px 24px;
  background:rgba(255,255,255,.92); border-radius:28px;
  box-shadow:0 18px 50px rgba(0,0,0,.15); text-align:center;
  position:relative; overflow:hidden;
}
h1{color:#ff4f87;font-size:30px;margin:8px 0 12px}
p{color:#555;font-size:18px;line-height:1.45}
.scene{height:250px;display:flex;justify-content:center;align-items:center;position:relative}
.face{font-size:105px;animation:bob 1.8s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-9px)}}
.hearts{position:absolute;inset:0;pointer-events:none}
.heart{position:absolute;font-size:25px;animation:float 3s infinite ease-in}
.heart:nth-child(1){left:12%;top:60%;animation-delay:.2s}
.heart:nth-child(2){right:14%;top:45%;animation-delay:1s}
.heart:nth-child(3){left:24%;top:18%;animation-delay:1.6s}
@keyframes float{0%{opacity:0;transform:translateY(30px) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}
.buttons{display:flex;gap:14px;justify-content:center;margin-top:22px}
button{
  border:0;border-radius:999px;padding:14px 27px;font-size:17px;font-weight:bold;
  cursor:pointer;transition:.2s;box-shadow:0 6px 15px rgba(0,0,0,.12)
}
#yes{background:#ff4f87;color:white}
#no{background:#eee;color:#444}
button:hover{transform:scale(1.06)}
#sad{display:none}
.tears{font-size:72px;animation:shake .55s infinite}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.retry{margin-top:12px;background:#222;color:#fff;display:none}
.small{font-size:14px;color:#888;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <div id="ask">
    <div class="scene">
      <div class="hearts"><span class="heart">💗</span><span class="heart">💕</span><span class="heart">💖</span></div>
      <div class="face">💌</div>
    </div>
    <h1>Anushka... 💗</h1>
    <p>Ek important sa question hai...</p>
    <p><b>Will you go on a date with me? 🌸</b></p>
    <div class="buttons">
      <button id="yes">YES 💕</button>
      <button id="no">NO 😭</button>
    </div>
    <div class="small">Please think carefully 🥹</div>
  </div>

  <div id="sad">
    <div class="scene"><div class="tears">😭</div></div>
    <h1>NOOOO 😭💔</h1>
    <p>Anushka ne <b>NO</b> kar diya...</p>
    <p>Ab dekho... main ro raha hoon 🥲</p>
    <button class="retry" id="retry">Dobara poochu? 🥺</button>
  </div>
</div>

<script>
const ask=document.getElementById("ask");
const sad=document.getElementById("sad");
const no=document.getElementById("no");
const yes=document.getElementById("yes");
const retry=document.getElementById("retry");

no.onclick=()=>{
  ask.style.display="none";
  sad.style.display="block";
  retry.style.display="inline-block";
};
yes.onclick=()=>{
  document.querySelector("#ask h1").textContent="YAYYY Anushka! 🥰💖";
  document.querySelector("#ask p:nth-of-type(2)").innerHTML="<b>Date confirmed! 🌷✨</b>";
  document.querySelector(".face").textContent="🥰";
  document.querySelector(".buttons").style.display="none";
  document.querySelector(".small").textContent="Best answer ever! 💕";
};
retry.onclick=()=>{
  sad.style.display="none";
  ask.style.display="block";
  document.querySelector("#ask h1").textContent="Anushka... 💗";
  document.querySelector("#ask p:nth-of-type(2)").innerHTML="<b>Will you go on a date with me? 🌸</b>";
  document.querySelector(".face").textContent="💌";
  document.querySelector(".buttons").style.display="flex";
  document.querySelector(".small").textContent="Please think carefully 🥹";
};
</script>
</body>
</html>
